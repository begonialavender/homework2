{% extends "base.html" %}
{% block title %}登录 · 问卷系统{% endblock %}
{% block content %}
<div class="fill-wrap" style="max-width:420px;">
  <div class="panel">
    <h1>登录</h1>
    <p class="subtle" style="margin-top:0;">使用你的账号创建并管理问卷</p>
    <form method="post">
      <label class="field">
        <span>用户名</span>
        <input type="text" name="username" value="{{ username }}" required autofocus>
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" name="password" required>
      </label>
      <button class="btn" type="submit" style="width:100%;justify-content:center;">登录</button>
    </form>
    <p class="subtle" style="margin-bottom:0;margin-top:16px;">
      还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>
    </p>
  </div>
</div>
{% endblock %}
